<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f0e6"><title>Daily News</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./app-icon.png"><link rel="apple-touch-icon" href="./app-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daily News"><link rel="stylesheet" href="./page-turn.css"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#292925;background:#f5f0e6}*{box-sizing:border-box}body{margin:0}main{height:100svh;height:100dvh;max-height:100dvh}#reader{height:100%;width:min(100%,680px);margin:auto;background:#ddd}article{background:#283b3d;color:#fff}.story-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo-fallback{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#536b65,#233b43);font:italic 26px Georgia;color:#f3ead8}.mast{position:absolute;top:max(16px,env(safe-area-inset-top));left:22px;font-size:12px;letter-spacing:2px;color:white;text-shadow:0 1px 8px #000}.copy{position:absolute;bottom:0;left:0;right:0;max-height:72%;overflow:auto;padding:90px 24px max(28px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#f5f0e6f2 25%,#f5f0e6 65%);color:#292925}.category{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:#795544}.copy h1{font:normal clamp(30px,8vw,48px)/1.03 Georgia;margin:12px 0}.teaser{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{max-height:30dvh;overflow:auto;overscroll-behavior:contain;line-height:1.55}.read{border:0;background:none;padding:10px 0;color:#292925;text-decoration:underline;font-weight:700}.count{float:right;font-size:12px;margin-top:12px}.source{font-size:12px}.source a{color:#754631;display:block;margin-top:6px}.edition{position:absolute;top:max(18px,env(safe-area-inset-top));right:22px;color:white;font-size:11px;text-shadow:0 1px 8px #000}#message{padding:24px;color:#292925}#review{position:fixed;bottom:4px;left:8px;font-size:9px;color:#888} 
</style></head><body><main><div id="reader" aria-live="polite"><div id="message">Loading today's edition…</div></div></main><small id="review"></small><section style="position:fixed;bottom:0;left:0;right:0;background:#f5f0e6ed;padding:6px 14px;font-size:11px"><button id="notification-toggle" type="button">Enable notifications</button><span id="push-status" role="status"></span></section><script type="module">
import {PageTurn} from './page-turn.js';
const root=document.querySelector('#reader'), msg=document.querySelector('#message');
const safe=(v)=>typeof v==='string'?v:'';
function createPage(item,index,total){
 const page=document.createElement('article'), category=safe(item.category)||'News';
 page.innerHTML='<div class="photo-fallback" aria-hidden="true">Daily News</div><img class="story-photo" alt=""><span class="mast">DAILY NEWS</span><span class="edition">'+(index+1)+' / '+total+'</span><div class="copy"><span class="category"></span><h1></h1><p class="teaser"></p><button class="read" aria-expanded="false">Read more</button><span class="count"></span><div class="summary" hidden></div><div class="source"></div></div>';
 page.querySelector('.category').textContent=category;
 page.querySelector('h1').textContent=safe(item.working_headline||item.headline)||'Untitled story';
 const summary=safe(item.draft_summary||item.summary);
 page.querySelector('.teaser').textContent=summary;
 const expanded=page.querySelector('.summary'); expanded.textContent=summary;
 const button=page.querySelector('.read');button.onclick=()=>{expanded.hidden=!expanded.hidden;button.textContent=expanded.hidden?'Read more':'Show less';button.setAttribute('aria-expanded',String(!expanded.hidden));};
 const image=safe(item.image_url||item.image||item.photo_url);
 const img=page.querySelector('img');if(/^https:\/\//i.test(image)){img.src=image;img.onload=()=>page.querySelector('.photo-fallback').hidden=true;img.onerror=()=>img.remove();}
 const sources=Array.isArray(item.sources)?item.sources:[];
 if(sources.length){const s=sources[0],url=s.article?.retrieved_url||s.url;try{const u=new URL(url);if(['https:','http:'].includes(u.protocol)){const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=(safe(s.publisher)||'Source')+' · Read original';page.querySelector('.source').append(a);}}catch{}}
 return page;
}
fetch('./briefing.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
 const stories=Array.isArray(data.items)?data.items.filter(x=>x?.status==='confirmed'):[];
 if(!stories.length){root.innerHTML='<div id="message">No confirmed stories are available in this edition yet.</div>';return;}
 const pages=stories.slice(0,3).map((x,i)=>createPage(x,i,Math.min(stories.length,3)));
 root.replaceChildren();window.dailyNewsReader=new PageTurn(root,pages);
 document.querySelector('#review').textContent=(data.review_queue||[]).length?'Additional research leads are unverified and not shown as confirmed stories.':'';
}).catch(()=>{root.innerHTML='<div id="message">Today’s edition could not be loaded. Please try again later.</div>';});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script><script src="./push-config.js"></script><script src="./push.js" defer></script></body></html>
