<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Daily News | Briefing</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily News">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191919;background:#fff;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #dedede;padding:18px max(20px,calc((100vw - 900px)/2))}
.brand{font-size:27px;font-weight:850;letter-spacing:-1.5px}.brand b{color:#f27222}.eyebrow{font-size:12px;letter-spacing:1.7px;text-transform:uppercase;color:#666;font-weight:750}
main{max-width:900px;margin:auto;padding:36px 20px 80px}h1{font-size:clamp(35px,8vw,62px);letter-spacing:-2px;margin:10px 0;line-height:1.04}h2{font-size:24px;letter-spacing:-.7px}
.description{color:#5e5e5e;line-height:1.55}.status{display:inline-block;background:#f6f6f6;border:1px solid #dedede;border-radius:3px;padding:7px 10px;font-size:13px;font-weight:700;margin-top:12px}
.story{border-top:1px solid #d8d8d8;padding:23px 0}.story h3{font-size:clamp(22px,5vw,30px);line-height:1.2;letter-spacing:-.7px;margin:10px 0}.story p{line-height:1.68;margin:11px 0}.tag{font-size:12px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:#a34c19}
.lead-image{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f3f3f3;margin:15px 0 5px;border-radius:3px}.photo-caption{font-size:11px!important;line-height:1.45!important;color:#757575;margin:5px 0 15px!important}.more-story{border-top:1px solid #dedede;padding:15px 0}.more-story a{color:#1b1b1b;font-weight:750;text-decoration:none;font-size:clamp(18px,4vw,22px);line-height:1.35}.more-story a:hover{text-decoration:underline}.more-story .tag{margin-bottom:6px}.more-source{color:#777;font-size:12px;margin-top:6px}summary{cursor:pointer;font-weight:700;padding:10px 0}details{background:#fafafa;border-left:3px solid #e4e4e4;padding:6px 14px;margin-top:17px}
a{color:#ad4b13;overflow-wrap:anywhere}ul{padding-left:20px}li{margin:9px 0}.notice{background:#fff7ee;border-left:4px solid #e58c40;padding:15px;line-height:1.5;margin:20px 0}
footer{margin-top:60px;color:#777;font-size:13px;border-top:1px solid #ddd;padding-top:20px}
</style></head>
<body><header><div class="brand">DAILY <b>NEWS</b></div></header>
<main>
<div class="eyebrow">Your daily briefing</div>
<h1>Today's stories.</h1>
<p class="description" id="date">Checking the latest available edition…</p>
<div id="content" role="status" aria-live="polite"></div>
<footer>Original short briefings with publisher attribution. Always consult primary reporting for important decisions.</footer>
</main>
<script>
"use strict";
const content=document.getElementById("content");
const dateEl=document.getElementById("date");
const el=(name,cls,value)=>{const node=document.createElement(name);if(cls)node.className=cls;if(value!==undefined)node.textContent=String(value);return node;};
// Commons illustration lookup: require lexical headline relevance, otherwise omit photo.
function addIllustration(article,headline){
 const tokens=new Set((headline.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!["after","amid","about","could","would","their","these","those","world","today","report","news","says","said"].includes(w)));
 const query=[...tokens].slice(0,7).join(" ");
 if(tokens.size<2||!query)return;
 const params=new URLSearchParams({action:"query",generator:"search",gsrsearch:query+" filetype:bitmap",gsrnamespace:"6",gsrlimit:"8",prop:"imageinfo",iiprop:"url|mime",iiurlwidth:"900",format:"json",origin:"*"});
 fetch("https://commons.wikimedia.org/w/api.php?"+params,{signal:AbortSignal.timeout(5500)}).then(r=>r.json()).then(data=>{
  const candidates=Object.values(data.query?.pages||{});
  const matching=candidates.find(p=>{
   const title=(p.title||"").toLowerCase();
   const matches=[...tokens].filter(t=>title.includes(t));
   const info=p.imageinfo?.[0];
   return matches.length>=2&&info?.mime==="image/jpeg"&&info.thumburl?.startsWith("https://upload.wikimedia.org/");
  });
  if(!matching)return;
  const info=matching.imageinfo[0], img=el("img","lead-image");
  img.src=info.thumburl;img.alt="Related illustrative photograph: "+matching.title.replace(/^File:/,"");
  img.loading="lazy";img.referrerPolicy="no-referrer";img.onerror=()=>{img.remove();caption.remove();};
  const caption=el("p","photo-caption");
  caption.append(document.createTextNode("Illustrative photo, not necessarily from the original article. Source: "));
  const a=el("a","","Wikimedia Commons");a.href=info.descriptionurl||"https://commons.wikimedia.org/";a.target="_blank";a.rel="noopener noreferrer";caption.append(a);
  article.querySelector("h3")?.after(img,caption);
 }).catch(()=>{}); // No irrelevant image as fallback.
}
function display(data){
  content.replaceChildren();
  if(!data || !Array.isArray(data.items) || !Array.isArray(data.review_queue)) throw Error("Invalid briefing structure");
  dateEl.textContent=data.date_utc ? "Edition date (UTC): "+data.date_utc : "Edition date unavailable";
  const confirmed=data.items.filter(x=>x && x.status==="confirmed");
  const drafts=data.review_queue.filter(x=>x && x.status==="insufficient_evidence");
  const summary=el("div","status",confirmed.length+" confirmed stories · "+drafts.length+" research leads");
  content.append(summary);
  if(data.pipeline_status==="failed") content.append(el("p","notice","The news research pipeline failed. No articles are available."));
  else if(confirmed.length===0) content.append(el("p","notice","No stories have passed the verification gate. Research leads below are UNVERIFIED and must not be treated as confirmed news."));
  const section=(title,items,isDraft)=>{
    if(!items.length)return;
    content.append(el("h2","",title));
    items.slice(0,3).forEach(item=>{
      const article=el("article","story");
      article.append(el("div","tag",isDraft?"Unverified research lead":item.category||"News"));
      const headline=item.working_headline||item.headline||"Untitled story";
      article.append(el("h3","",headline));
      addIllustration(article,headline);
      const body=item.draft_summary||item.summary;
      if(body)article.append(el("p","",body));
      const why=item.why_it_matters_draft||item.why_it_matters;
      if(why)article.append(el("p","", "Why it matters: "+why));
      if(isDraft)article.append(el("p","description","Status: insufficient evidence. This AI-generated draft is not independently verified."));
      const sources=Array.isArray(item.sources)?item.sources:[];
      if(sources.length){
        const details=el("details"),heading=el("summary","","Sources ("+sources.length+")"),list=el("ul");
        sources.forEach(source=>{
          const li=el("li"),publisher=el("span","",source.publisher||"Source");
          li.append(publisher);
          const url=source.article?.retrieved_url ||source.url;
          try{
            const parsed=new URL(url);
            if(parsed.protocol==="https:"||parsed.protocol==="http:"){
              li.append(document.createTextNode(" — "));
              const link=el("a","",source.title||"Read source");
              link.href=parsed.href;link.target="_blank";link.rel="noopener noreferrer";
              li.append(link);
            }
          }catch{}
          list.append(li);
        });
        details.append(heading,list);article.append(details);
      }
      content.append(article);
    });
  };
  section("Confirmed stories",confirmed,false);
  section("Research leads — unverified",drafts,true);
  const others=(Array.isArray(data.additional_headlines)?data.additional_headlines:[]).slice(0,7);
  if(others.length){
    content.append(el("h2","","More headlines"));
    others.forEach(item=>{
      const article=el("article","more-story");article.append(el("div","tag",(item.category||"News")+" · Unverified headline"));
      const link=el("a","",item.headline||"Untitled");try{
       const u=new URL(item.url);if(u.protocol!=="https:")return;link.href=u.href;
      }catch{return;}
      link.target="_blank";link.rel="noopener noreferrer";article.append(link);
      article.append(el("div","more-source",item.publisher||"Source link"));
      content.append(article);
    });
  }
  if(!confirmed.length&&!drafts.length&&!others.length)content.append(el("p","description","No stories are available in this edition."));
}
fetch("./briefing.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Briefing unavailable");return r.json()}).then(display).catch(()=>{dateEl.textContent="Edition unavailable";content.replaceChildren(el("p","notice","The briefing could not be loaded. Please try again later."));});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script></body></html>
