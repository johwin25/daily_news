
name: Test Daily News

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run my first Python script
        run: python main.py

      - name: Test publisher allowlist (offline)
        run: python -m unittest -v test_news_fetcher.py

      - name: Fetch Google News headlines
        run: python news_fetcher.py
