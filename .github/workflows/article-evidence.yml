name: Test BBC Evidence Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'news_article_evidence.py'
      - 'test_news_article_evidence.py'
      - 'news_editor.py'
      - 'news_contracts.py'
      - '.github/workflows/article-evidence.yml'

permissions:
  contents: read

jobs:
  article-evidence:
    name: Check BBC text to Gemini quotations
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -v
      - name: Retrieve one current BBC article and validate Gemini quotations
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_article_evidence.py --live-check
      - name: Retain live evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbc-evidence-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/article-evidence-check/
          if-no-files-found: ignore
          retention-days: 3
