name: Build Mobile News Edition
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # 09:15 Asia/Seoul, best effort (Actions may delay)
permissions:
  contents: read
concurrency:
  group: daily-mobile-edition
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -v
      - name: Generate research briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_pipeline.py
      - name: Export safe reader edition
        run: |
          EDITION=$(date -u +%F)
          python news_public_export.py "output/$EDITION/briefing.json" "web/briefing.json"
      - name: Upload preview site (not public)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-edition-preview-${{ github.run_id }}
          path: web/
          if-no-files-found: error
          retention-days: 7
