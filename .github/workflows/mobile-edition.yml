name: Publish Daily News Website

on:
  workflow_dispatch:
  # Deploy immediately when this workflow configuration changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-edition.yml'
      - 'web/**'
      - 'push/send.js'
  schedule:
    - cron: '0 23 * * *' # 08:00 Asia/Seoul (following local day) (GitHub schedules are best-effort)
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-edition.yml'
      - 'news_public_export.py'
      - 'test_news_public_export.py'
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: pages-daily-news
  cancel-in-progress: false

jobs:
  tests:
    name: Offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v

  deploy:
    name: Generate and publish website
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate fresh research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_pipeline.py
      - name: Export limited public edition
        run: |
          EDITION=$(date -u +%F)
          python news_public_export.py "output/$EDITION/briefing.json" "web/briefing.json"
          python -c 'import json; from pathlib import Path; p=Path("web/briefing.json"); d=json.loads(p.read_text()); assert d["confirmed_count"] == 0 and d["items"] == []; assert "review_queue" in d; print("PASS: sanitized edition ready")'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package only the reader directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send opt-in Web Push alerts
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          cd push
          npm install --no-save --ignore-scripts web-push@3.6.7
          node send.js
