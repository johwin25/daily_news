name: Daily News Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - '.github/workflows/research.yml'

permissions:
  contents: read

concurrency:
  group: news-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Offline pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection, model contracts, and evidence gate
        run: python -m unittest discover -v

  research:
    name: Generate news research report
    needs: tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect, shortlist, search, and compare claims
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_pipeline.py
      - name: Export and validate mobile reader edition
        run: |
          EDITION=$(date -u +%F)
          python news_public_export.py "output/$EDITION/briefing.json" "web/briefing.json"
          python -c 'import json; from pathlib import Path; d=json.loads(Path("web/briefing.json").read_text()); assert d["confirmed_count"] == 0 and d["items"] == []; print("PASS: safe public reader JSON exported")'
      - name: Upload mobile edition preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-edition-pr-preview-${{ github.run_id }}
          path: web/
          if-no-files-found: error
          retention-days: 3
      - name: Show report or failure in run summary
        if: always()
        run: python news_report.py
      - name: Save dated research and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 14
