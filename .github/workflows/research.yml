name: Daily News Research

on:
  workflow_dispatch:
    inputs:
      deliver:
        description: 'Send the completed briefing to your configured private Telegram chat'
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '0 0 * * 0,6'
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - '.github/workflows/research.yml'

permissions:
  contents: read

concurrency:
  group: news-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Offline pipeline tests
    if: github.event_name != 'schedule' || vars.DAILY_NEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection, model contracts, and evidence gate
        run: python -m unittest discover -v

  research:
    name: Generate news research report
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.DAILY_NEWS_ENABLED == 'true') || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect, shortlist, search, and compare claims
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_pipeline.py
      - name: Prepare and revalidate Telegram message without sending
        run: python news_delivery.py
      - name: Show report or failure in run summary
        if: always()
        run: python news_report.py
      - name: Save dated research and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-research-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  delivery:
    name: Deliver private Telegram alert
    needs: research
    if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && vars.DAILY_NEWS_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deliver))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: daily-news-private-telegram-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the checked research artifacts
        if: needs.research.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: daily-news-research-${{ github.run_id }}
          path: output/
      - name: Send the revalidated briefing
        if: needs.research.result == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python news_delivery.py --send
      - name: Send a fixed research failure alert
        if: needs.research.result != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python news_delivery.py --send --failure-notice
      - name: Retain delivery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/delivery/
          if-no-files-found: ignore
          retention-days: 7

